# dsh-client-ui-trajectory-plus bundle patch: inserts the plugin row into the
# profile roster.
#
# The node half serves the loopback-only GET /dsh-client-ui-trajectory-plus/state
# route. The browser half (exports "./client") registers the third conversation
# view tab (id "surface", order 20) and renders one card per turn.
#
# The entry name is the BARE package name on purpose: the client-module scanner
# treats it as a package specifier and resolves <name>/package.json, so a subpath
# entry would be cached as "not a client package" and the browser half would
# silently never load.
- insert:
    - id: dsh-client-ui-trajectory-plus
      name: 'dsh-client-ui-trajectory-plus'
